services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - ENV=development
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      # Change localhost to the service name "backend"
      - NEXT_PUBLIC_API_URL=http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    restart: unless-stopped